name: Build WebRtcNet

# Builds WebRtcNet using pre-built WebRTC artifacts pulled from GHCR.
# Update WEBRTC_BRANCH below when the WebRTC branch pin changes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io/general-fault
  WEBRTC_BRANCH: '7778'

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Switch to Windows containers
        run: '& "$env:ProgramFiles\Docker\Docker\DockerCli.exe" -SwitchWindowsEngine'
        shell: pwsh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build WebRtcNet
        run: docker build -f docker/Dockerfile.webrtcnet --build-arg "WEBRTC_ARTIFACTS_IMAGE=$env:REGISTRY/webrtc:msvc-shared-$env:WEBRTC_BRANCH" .
        shell: pwsh
